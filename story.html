<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project RECLAIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Michroma&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root { --bg:#03060b; --ink:#dbeaf2; --dim:rgba(219,234,242,.62); --cyan:#46d9ff; --amber:#ffb000; --green:#5dff9e; --orange:#ff9a3c; --red:#ff6b5a; --panel:rgba(4,9,16,.82); --line:rgba(70,217,255,.38); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font-family:"Chakra Petch", "Segoe UI", system-ui, sans-serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .mono { font-family:"Space Mono", ui-monospace, monospace; }
  .hud { position:fixed; z-index:5; pointer-events:none; }
  #obj { top:14px; left:14px; width:min(360px, calc(100vw - 28px)); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; }
  #obj .kick { font:700 .68rem "Space Mono", monospace; letter-spacing:.12em; color:var(--cyan); }
  #obj .name { font:400 1rem "Michroma", sans-serif; margin:4px 0 6px; }
  #obj .goal { font-size:.95rem; }
  #obj .dist { margin-top:6px; display:flex; align-items:center; gap:8px; font:700 .8rem "Space Mono", monospace; color:var(--amber); }
  #arrow { width:18px; height:18px; display:inline-block; transition:transform .1s; }
  #meters { top:70px; right:14px; width:min(260px, calc(100vw - 28px)); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:none; }
  .meter { margin:6px 0; font:700 .72rem "Space Mono", monospace; letter-spacing:.06em; }
  .meter .bar { height:8px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; margin-top:4px; }
  .meter .fill { height:100%; width:0; background:var(--green); transition:width .15s; }
  #prompt { left:50%; bottom:86px; transform:translateX(-50%); pointer-events:auto; display:none; font:700 1rem "Space Mono", monospace; background:rgba(255,176,0,.16); color:#fff; border:1px solid var(--amber); border-radius:6px; padding:12px 22px; cursor:pointer; }
  #prompt kbd { background:var(--amber); color:#000; padding:2px 8px; border-radius:4px; margin-right:6px; }
  #toast { left:50%; top:16px; transform:translateX(-50%); max-width:min(640px, 70vw); text-align:center; font-size:1rem; color:var(--amber); text-shadow:0 0 8px #000; opacity:0; transition:opacity .3s; }
  #fact { left:14px; top:150px; width:min(360px, calc(100vw - 28px)); background:var(--panel); border:1px solid rgba(93,255,158,.45); border-radius:6px; padding:12px 14px; display:none; }
  #fact .kick { font:700 .68rem "Space Mono", monospace; letter-spacing:.12em; color:var(--green); }
  #fact h4 { margin:4px 0; font-weight:600; }
  #fact p { margin:0; font-size:.92rem; line-height:1.45; }
  #keys { left:50%; bottom:14px; transform:translateX(-50%); font:400 .75rem "Space Mono", monospace; color:var(--dim); text-align:center; white-space:nowrap; }
  #top { position:fixed; z-index:6; top:14px; right:14px; display:flex; gap:8px; }
  #top.low { top:auto; bottom:44px; }
  .btn { font:600 .95rem "Chakra Petch", sans-serif; letter-spacing:.03em; color:var(--ink); background:rgba(255,176,0,.12); border:1px solid var(--amber); border-radius:6px; padding:10px 18px; min-height:44px; cursor:pointer; }
  .btn:hover { background:rgba(255,176,0,.3); }
  .btn.sec { background:rgba(4,9,16,.8); border-color:rgba(70,217,255,.5); }
  .btn.sec:hover { background:rgba(70,217,255,.2); }
  .btn:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  /* briefing and history panels: large, centred above the subtitles, with roomy type and big buttons */
  #card { position:fixed; inset:0; z-index:8; display:none; align-items:center; justify-content:center; padding:20px 24px 150px; background:radial-gradient(ellipse at 50% 40%, rgba(2,4,8,.25), rgba(2,4,8,.6)); }
  #card .box { box-sizing:border-box; width:min(1000px, 100%); max-height:calc(100vh - 170px); min-height:0; overflow:auto; background:linear-gradient(180deg, rgba(9,18,30,.96), rgba(4,9,16,.97)); border:1px solid rgba(70,217,255,.45); border-radius:14px; padding:clamp(22px, 3vw, 42px) clamp(22px, 3.8vw, 56px); font-size:1.08rem; line-height:1.62; box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07); }
  #card .kick { font:700 .76rem "Space Mono", monospace; letter-spacing:.14em; }
  #card h2 { font:400 clamp(1.45rem, 2.7vw, 2.2rem) "Michroma", sans-serif; line-height:1.25; margin:12px 0 12px; }
  #card h3 { font:700 .84rem "Space Mono", monospace; letter-spacing:.14em; color:var(--cyan); margin:22px 0 8px; }
  #card p { margin:.55em 0; }
  #card .row .btn { min-height:54px; padding:14px 30px; font-size:1.06rem; min-width:190px; }
  .brief .accent { width:72px; height:4px; border-radius:2px; margin:4px 0 16px; }
  .brief .meta { font:700 1rem "Space Mono", monospace; letter-spacing:.06em; color:var(--dim); }
  .brief .task { margin-top:20px; padding:16px 22px; border-left:3px solid var(--amber); background:rgba(255,176,0,.07); border-radius:0 10px 10px 0; }
  .brief .task h3 { margin:0 0 6px; color:var(--amber); }
  .brief .task p { font-size:1.2rem; line-height:1.6; margin:0; }
  .brief .fine { opacity:.72; font-size:.95rem; margin-top:18px; }
  @media (max-width:640px) { #card { padding:12px 12px 140px; } #card .row .btn { flex:1 1 100%; } }
  #card ul { margin:.3em 0; padding-left:1.2em; }
  #card a { color:var(--cyan); }
  #card .row { display:flex; gap:14px; flex-wrap:wrap; margin-top:26px; }
  #card details { margin-top:10px; }
  #card details summary { cursor:pointer; color:var(--cyan); }
  .tag { display:inline-block; font:700 .72rem "Space Mono", monospace; letter-spacing:.1em; padding:4px 10px; border:1px solid currentColor; border-radius:4px; margin:0 6px 4px 0; }
  .tag.fic { color:var(--orange); } .tag.real { color:var(--green); } .tag.rec { color:var(--cyan); }
  #fade { position:fixed; inset:0; z-index:9; background:#000; opacity:1; pointer-events:none; transition:opacity .7s; }
  #skip { position:fixed; z-index:7; right:16px; bottom:52px; display:none; }
  #ficLbl { position:fixed; z-index:6; right:14px; bottom:14px; font:700 .62rem "Space Mono", monospace; letter-spacing:.16em; color:var(--orange); background:rgba(4,9,16,.72); border:1px solid rgba(255,154,60,.5); border-radius:4px; padding:5px 9px; pointer-events:none; opacity:0; transition:opacity .4s; }
  #ffLbl { position:fixed; z-index:6; left:50%; top:16px; transform:translateX(-50%); font:700 .8rem "Space Mono", monospace; letter-spacing:.14em; color:#000; background:var(--amber); border-radius:4px; padding:6px 12px; display:none; }
  #endtext { position:fixed; inset:0; z-index:7; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; padding:20px; }
  #endtext .word { font:400 clamp(1.8rem, 5vw, 3.4rem) "Michroma", sans-serif; letter-spacing:.08em; text-shadow:0 0 22px rgba(70,217,255,.6); }
  #endtext .sub { font:700 .9rem "Space Mono", monospace; letter-spacing:.2em; color:var(--cyan); margin-bottom:10px; }
  #endtext .mc { max-width:720px; font-size:1.05rem; line-height:1.6; background:rgba(4,9,16,.8); border:1px solid var(--line); border-radius:8px; padding:18px 22px; }
  #endtext h1 { font:400 clamp(1.6rem, 4.6vw, 3rem) "Michroma", sans-serif; letter-spacing:.06em; margin:0 0 12px; }
  #endtext .quote { font-size:1.2rem; color:var(--amber); }
  #endtext .row { pointer-events:auto; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:22px; }
  .rocks { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px; }
  .rock { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px; min-height:44px; background:rgba(255,255,255,.04); border:1px solid rgba(70,217,255,.35); border-radius:8px; color:var(--ink); font:500 .82rem "Chakra Petch", sans-serif; cursor:pointer; transition:transform .25s, opacity .4s, background .2s; }
  .rock:hover, .rock:focus-visible { background:rgba(70,217,255,.14); outline:none; border-color:var(--amber); }
  .rock canvas { width:100%; max-width:132px; height:auto; }
  .rock .lens { min-height:2.6em; opacity:.85; text-align:center; }
  .rock.no { animation:shake .4s; border-color:var(--red); } .rock.bag { transform:scale(.6) translateY(30px); opacity:.35; border-color:var(--green); }
  @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  @media (max-width:520px) { .rocks { grid-template-columns:1fr; } }
  #mini { display:block; margin:10px auto; max-width:100%; }
  .fadein { animation:fi 1s ease both; } @keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @media (max-width:700px) { #keys { display:none; } #fact { bottom:120px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="obj" class="hud"><div class="kick">PROJECT RECLAIM · 2075 · FICTIONAL EXPEDITION</div><div class="name" id="oName"></div><div class="goal" id="oGoal"></div><div class="dist" id="oDist"><svg id="arrow" viewBox="0 0 20 20"><path d="M10 1 L17 17 L10 13 L3 17 Z" fill="#ffb000"/></svg><span id="oDistTxt"></span></div></div>
<div id="meters" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="fact" class="hud"><div class="kick" id="fKick">REAL NASA HISTORY</div><h4 id="fTitle"></h4><p id="fText"></p></div>
<button id="prompt" class="hud" type="button"></button>
<div id="keys" class="hud"></div>
<div id="top"><button class="btn sec" id="bLearn" type="button">Learn more</button><button class="btn sec" id="bExit" type="button">Mission select</button></div>
<div id="card" role="dialog" aria-modal="true"><div class="box" id="cardBox"></div></div>
<button class="btn" id="skip" type="button">Skip ▶</button>
<div id="ficLbl" aria-hidden="true">FICTIONAL EXPEDITION · 2075</div>
<div id="ffLbl" role="status">⏩ FAST FORWARD · solar charging ×12</div>
<div id="endtext"></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="shared/anim.js"></script>
<script src="shared/models.js"></script>
<script src="shared/visuals.js"></script>
<script src="shared/voice.js"></script>
<script>
/* ================= setup ================= */
const QS = new URLSearchParams(location.search), MID = QS.get('mission'), ENDING = QS.get('ending') === '1', PHASE0 = QS.get('phase') || 'travel';
const C = MISSIONS.find(m => m.id === MID), RC = RECLAIM[MID];
if (!ENDING && (!C || !RC)) location.replace('index.html');
const HOMEPAGE = 'index.html';
const $ = id => document.getElementById(id), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, ease = t => t * t * (3 - 2 * t);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;   // filmic contrast, so bright sunlit dust and dark shadows both keep detail
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 1500);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const std = (c, r = .8, m = .05, e = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, emissive: e });

/* ================= audio ================= */
let ac = null;
const audio = () => { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); return ac; };
addEventListener('pointerdown', audio); addEventListener('keydown', audio);
function beep(f, dur = .1, type = 'sine', vol = .06, delay = 0) {
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}
function rumble(dur = 3, vol = .12) {
  if (!ac) return; const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / 8000) * Math.min(1, (n - i) / 20000);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'lowpass'; f.frequency.value = 260; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
const arp = n => n.forEach((f, i) => beep(f, .16, 'triangle', .07, i * .1));

/* ================= UI helpers ================= */
let toastT = 0;
function toast(t, ms = 4000) { $('toast').textContent = t; $('toast').style.opacity = 1; ANIM.pop($('toast'), 1.1); clearTimeout(toastT); toastT = setTimeout(() => $('toast').style.opacity = 0, ms); }
/* facts and guidance are spoken, with typed subtitles that fade away (shared/voice.js) */
VO.init({ bottom: 140, mute: { left: '14px', bottom: '14px' } });
/* a small, non-blocking fact panel (gameplay keeps running) */
let factT = 0;
function factBox(title, html, kick = 'REAL NASA HISTORY', ms = 14000) { $('fKick').textContent = kick; $('fTitle').textContent = title; $('fText').innerHTML = html; $('fact').style.display = 'block'; ANIM.stagger([$('fact')], { opacity: 0, x: -24 }); clearTimeout(factT); factT = setTimeout(() => $('fact').style.display = 'none', ms); }
function say(id, opt) { beep(880, .06); beep(1320, .08, 'sine', .04, .07); return VO.say(id, opt); }
function showCard(html, buttons) {
  $('cardBox').innerHTML = html + '<div class="row">' + buttons.map((b, i) => '<button class="btn' + (b.sec ? ' sec' : '') + '" data-i="' + i + '" type="button">' + esc(b.label) + '</button>').join('') + '</div>';
  $('card').style.display = 'flex'; S.card = true; VO.lift(true); ANIM.card($('cardBox'));
  $('cardBox').querySelectorAll('button[data-i]').forEach(el => el.onclick = () => { const b = buttons[+el.dataset.i]; if (!b.keep) hideCard(); b.on && b.on(); });
  const first = $('cardBox').querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function hideCard() { $('card').style.display = 'none'; S.card = false; VO.lift(false); }
const fadeTo = (v, ms = 700) => new Promise(r => { $('fade').style.transition = 'opacity ' + ms + 'ms'; $('fade').style.opacity = v; setTimeout(r, ms); });
function setObjective(goal, target) { $('oName').textContent = C ? C.short : ''; $('oGoal').textContent = goal; S.target = target || null; $('oDist').style.display = target ? 'flex' : 'none'; }
function setKeys(t) { $('keys').innerHTML = t; }
function learnMore() {
  if (!C) return;
  showCard('<span class="kick" style="color:' + C.accent + '">LEARN MORE · REAL NASA HISTORY</span><h2>' + esc(C.name) + '</h2><p class="meta">' + esc(C.years) + ' · ' + esc(C.where) + '</p>' +
    '<p>' + esc(C.before) + '</p><h3>Key facts</h3><ul>' + C.facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' +
    '<h3>Sources</h3><ul>' + C.sources.map(([t, u]) => '<li><a href="' + u + '" target="_blank" rel="noopener">' + esc(t) + '</a></li>').join('') + '</ul>' +
    '<p class="small" style="opacity:.7;font-size:.85rem">Project RECLAIM and everything set in 2075 is fiction. The history above is real.</p>', [{ label: 'Back to the mission' }]);
}
$('bLearn').onclick = learnMore;
$('bExit').onclick = () => showCard('<h2>Leave this mission?</h2><p>Your progress on this rover will not be saved.</p>', [{ label: 'Keep playing' }, { label: 'Mission select', sec: true, on: () => location.href = 'index.html?hub=1' }]);
$('skip').onclick = () => { S.skip = true; };

/* ================= input ================= */
const K = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); K[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (S.card) return;
  if (k === 'e' && !e.repeat) interact();
  if (k === 'f' && !e.repeat && S.onF) S.onF();
  if ((k === ' ' || k === 'enter') && $('skip').style.display === 'block') S.skip = true;
});
addEventListener('keyup', e => { K[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in K) K[k] = false; });
let drag = null;
$('c').addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; S.camT = performance.now(); });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', e => { if (!drag) return; S.camYaw -= (e.clientX - drag.x) * .006; S.camPitch = clamp(S.camPitch + (e.clientY - drag.y) * .004, .05, 1.1); drag = { x: e.clientX, y: e.clientY }; S.camT = performance.now(); });
$('c').addEventListener('wheel', e => { S.camDist = clamp(S.camDist * (1 + Math.sign(e.deltaY) * .08), 4, 20); }, { passive: true });
$('prompt').onclick = () => interact();
const down = (...ks) => ks.some(k => K[k]);

/* ================= state ================= */
const S = { phase: 'boot', card: false, skip: false, camYaw: 0, camPitch: .32, camDist: 7, camT: -1e9, target: null, t: 0 };

/* ================= procedural models ================= */
function makeRocket() { return VIS.rocket(renderer); }
function makeAstronaut(suitColor = 0xf2f2ec, accent = 0xff7a2f) { return VIS.astronaut(renderer, suitColor, accent); }
/* astronaut animation. Poses blend smoothly; on the Moon the walk becomes the bounding Apollo "lope" */
function poseAstronaut(a, mode, dt, speed) {
  const low = WORLD.env === 'MOON', L0 = a.legs[0], L1 = a.legs[1], k0 = L0.userData.knee, k1 = L1.userData.knee, E0 = a.arms[0].userData.elbow, E1 = a.arms[1].userData.elbow;
  const f = Math.min(1, dt * 12), to = (o, p, v, k = f) => { o[p] += (v - o[p]) * k; }, bend = (e0, e1, k = f) => { to(E0.rotation, 'x', -e0, k); to(E1.rotation, 'x', -e1, k); };
  a.t = (a.t || 0) + dt; a.landT = Math.max(0, (a.landT || 0) - dt * 2.2);
  if (a.head && mode !== 'idle') { to(a.head.rotation, 'y', 0, f * .5); to(a.head.rotation, 'x', 0, f * .5); }
  if (mode === 'carry') {   // walking with a box held in front (called after the walk pose)
    a.arms.forEach(r => { r.rotation.x = -1.05; r.rotation.z = 0; }); E0.rotation.x = E1.rotation.x = -.5; return;
  }
  if (mode === 'walk') {
    a.phase += dt * (low ? 4.6 : 7.2) * clamp(speed / 2.4, .6, 1.9);
    const sp = clamp(speed / 2.4, .7, 1.3), amp = (low ? .42 : .6) * sp, off = low ? 2.3 : Math.PI, s = Math.sin(a.phase), s1 = Math.sin(a.phase + off);
    to(L0.rotation, 'x', s * amp); to(L1.rotation, 'x', s1 * amp);
    to(k0.rotation, 'x', Math.max(0, Math.sin(a.phase + 1.3)) * .75 + .08); to(k1.rotation, 'x', Math.max(0, Math.sin(a.phase + off + 1.3)) * .75 + .08);
    const bob = low ? Math.pow(Math.max(0, Math.sin(a.phase - .4)), .8) * .17 * sp : Math.abs(Math.sin(a.phase)) * .045;
    to(a.hips.position, 'y', .95 + bob - a.landT * .16, Math.min(1, dt * 20));
    to(a.hips.rotation, 'x', .07 + speed * .02 + (low ? .05 : 0)); to(a.hips.rotation, 'y', s * .07); to(a.hips.rotation, 'z', a.bank || 0);
    to(a.arms[0].rotation, 'x', -s1 * amp * .75); to(a.arms[1].rotation, 'x', -s * amp * .75); to(a.arms[0].rotation, 'z', -.13); to(a.arms[1].rotation, 'z', .13);
    bend(.35 + Math.max(0, -s1) * .3, .35 + Math.max(0, -s) * .3);
    if (a.head) to(a.head.rotation, 'y', -s * .06);
  } else if (mode === 'air') {   // jumping: knees tuck on the way up, legs reach for the ground on the way down
    const up = (a.vyAir || 0) > 0;
    to(L0.rotation, 'x', up ? -.55 : -.12, f * .7); to(L1.rotation, 'x', up ? -.2 : .12, f * .7); to(k0.rotation, 'x', up ? 1.05 : .3, f * .7); to(k1.rotation, 'x', up ? .75 : .3, f * .7);
    to(a.arms[0].rotation, 'x', up ? -1.1 : -.45, f * .6); to(a.arms[1].rotation, 'x', up ? -.85 : -.35, f * .6); to(a.arms[0].rotation, 'z', up ? -.25 : -.6, f * .6); to(a.arms[1].rotation, 'z', up ? .25 : .6, f * .6);
    bend(.6, .6, f * .6); to(a.hips.rotation, 'x', up ? .16 : .02); to(a.hips.rotation, 'z', 0); to(a.hips.position, 'y', .95);
  } else if (mode === 'climb') {   // climbing the lander's ladder, facing it

    camera.position.lerp(camGoal, Math.min(1, dt * 1.2)); look.lerp(new THREE.Vector3(0, k < 3.4 ? base + 2 + (a.lift || 0) : rocket.position.y + 5, k < 3.4 ? -2.4 : 0), Math.min(1, dt * 2)); camera.lookAt(look);
    if (k > 8.4 && !S.leaving) { S.leaving = true; const p = setProgress(MID, true); fadeTo(1, 700).then(() => { location.href = 'index.html?done=' + encodeURIComponent(MID) + (RECLAIM_ORDER.every(id => p[id]) ? '&unlock=1' : ''); }); }
  };
}

/* ================= ending ================= */
function runEnding() {
  $('obj').style.display = 'none'; $('top').style.display = 'none';
  travel('mars', 'earth', montage, 'Returning to Earth');
}
function montage() {
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x02040a); sc.add(starField(1800, 600)); sc.fog = new THREE.Fog(0x02040a, 45, 110);
  sc.add(new THREE.HemisphereLight(0xdfe8ff, 0x202020, 1.1)); const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(10, 20, 15); sc.add(key);
  const rimL = new THREE.DirectionalLight(0x46d9ff, .8); rimL.position.set(-12, 8, -10); sc.add(rimL);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64), std(0x15191f, .9)); floor.rotation.x = -Math.PI / 2; sc.add(floor);
  const items = RECLAIM_ORDER.map((id, i) => {
    const m = MISSIONS.find(x => x.id === id), p = makePart(wholeDef(m, ['sand']), 'normal'), piv = new THREE.Group(), box = new THREE.Box3().setFromObject(p.g), s = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    p.g.position.copy(c).multiplyScalar(-1); piv.add(p.g); const k = 3 / Math.max(s.x, s.z); piv.scale.setScalar(k); piv.position.set((i - 1.5) * 7, s.y * k / 2 + .6, 0); sc.add(piv);
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, .6, 40), std(0x2a3240, .6, .3)); ped.position.set(piv.position.x, .3, 0); sc.add(ped);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.5, .05, 8, 60), new THREE.MeshBasicMaterial({ color: new THREE.Color(m.accent) })); ring.rotation.x = -Math.PI / 2; ring.position.set(piv.position.x, .62, 0); sc.add(ring);
    return { piv, m, id };
  });
  S.scene = sc; fadeTo(0, 900); const t0 = performance.now(); let shown = -1;
  const end = $('endtext'); end.style.display = 'flex';
  S.tick = (dt, now) => {
    const k = (now - t0) / 1000, idx = Math.min(4, Math.floor(k / 2.6));
    items.forEach(it => it.piv.rotation.y += dt * .5);
    const focus = idx < 4 ? items[idx].piv.position : new THREE.Vector3(0, 1, 0), want = idx < 4 ? new THREE.Vector3(focus.x + 3, 3.2, 8) : new THREE.Vector3(0, 7, 22);
    camera.position.lerp(want, Math.min(1, dt * 1.6)); camera.lookAt(focus.x, 1.4, 0);
    if (idx !== shown) {
      shown = idx; arp([392 + idx * 60, 523 + idx * 60]);
      if (idx < 4) { const it = items[idx]; end.innerHTML = '<div class="sub fadein">' + esc(it.m.short.toUpperCase()) + '</div><div class="word fadein" style="color:' + it.m.accent + '">' + esc(RECLAIM[it.id].word) + '</div>'; }
      else { say('ending'); end.innerHTML = '<div class="mc fadein"><div class="sub">MISSION CONTROL · 2075 · FICTIONAL</div>' + esc(RECLAIM_ENDING) + '</div>' +
        '<div class="fadein" style="animation-delay:1.6s;margin-top:26px"><h1>ABANDONED, NOT FORGOTTEN</h1><div class="quote">“Their journeys ended. Our exploration continues.”</div></div>' +
        '<div class="row fadein" style="animation-delay:2.4s"><a class="btn" href="index.html?hub=1">Back to the console</a><a class="btn sec" href="' + HOMEPAGE + '">Start screen</a></div>'; }
    }
  };
}

/* ================= boot ================= */
function boot() {
  requestAnimationFrame(loop);
  S.fic = !ENDING;   // the 2075 expedition is fiction: show the label (hidden whenever a card is open)
  if (ENDING) return runEnding();
  setObjective('', null);
  const bodyName = RC.body === 'MOON' ? 'moon' : 'mars';
  if (PHASE0 === 'drive') { startDriveBriefing(); }
  else if (PHASE0 === 'rover') { buildSurface(); S.scene = scene; S.ap = { x: rover.x + 3, z: rover.z + 2, yaw: 0 }; placeAstro(); fadeTo(0, 600); startWalk(); toast('Back on the surface. Inspect the rover again when you are ready'); }
  else travel('earth', bodyName, () => arriveSurface(true), 'Travelling to ' + C.where);
}
boot();
