tape across the broken edge', ...TAPE_H, 'Watch what happens to tape on a dusty fender'],\r\n    ['The overnight fix was four stiff, laminated maps taped into one sheet', ['Pinch a map, carry it to an empty outline and open your fingers', 'Drag each map onto an empty outline'], 'Fill all four outlines'],\r\n    ['Two seams join the four maps: one across and one down', ...TAPE_H, 'The strip must cover the whole seam'],\r\n    [['Pinch the taped sheet and carry it to the glowing spot where the extension broke off', 'Drag the taped sheet to the glowing spot where the extension broke off'], 'Let go there to fit it onto the fender'],\r\n    ['The crew held the sheet on with clamps borrowed from the portable lights', ...BOLT_H(1)],\r\n    ['Turn the wheel again, the same way as before', 'Compare how much dust reaches the seat now']],\r\n  spirit_wheel: [\r\n    ['For months this right-front wheel had drawn too much current', ['Point at \"Send drive command\" and hold, or pinch it', 'Click \"Send drive command\"'], 'Watch the current meter and the wheel at the same time. Send two commands'],\r\n    ['Remember that nobody can reach Mars to repair it', 'Pick what the team should do. A wrong answer explains why it would not work'],\r\n    ['With one wheel dead, Spirit drove backwards, dragging the dead wheel behind it', ['Pinch the wheel and move your hand left and right along the soil', 'Hold the mouse button on the wheel and drag it left and right'], 'Go from one end of the trench to the other and back, 3 times', 'Watch what appears under the red top soil']],\r\n  mer_wheel: [\r\n    ['Four bolts hold the wheel onto the hub', ...BOLT_H(-1)],\r\n    [['Pinch the loose wheel and pull it towards you', 'Drag the loose wheel off the hub'], 'Let go over the scrap bin'],\r\n    ['The spares rack holds three parts. Only one is a wheel for this hub', ['Pinch the right spare and carry it onto the green outline', 'Drag the right spare onto the green outline'], 'A wrong part is rejected, and you are told why'],\r\n    ['Put the 4 hub bolts back in', ...BOLT_H(1)]],\r\n  spirit_escape: [\r\n    ['Spirit is stuck in soft sand that hides a crust at a place called \"Troy\"', 'Pick a direction: forward, backward or wiggle', ['Pinch and drag the speed slider, then press Try drive', 'Drag the speed slider, then click Try drive'], 'Try at least 3 drives, including a slow one, and read the slip after each']],\r\n  mer_tow: [\r\n    ['This one is a what-if: there was never a tow line on Mars', ['Raise both hands. Lay the string between your index fingers across the TOW POINT hook', 'Press the mouse on the TOW POINT hook'], ['Pull your hands apart until the string is taut, then hold', 'Drag far away from the hook and keep the button held'], 'Keep it taut until the meter is full']],\r\n  spirit_winter: [\r\n    ['The winter Sun is low, so tilting the panels towards it gives more power', ['Pinch the knob and twist, or circle it with a fingertip', 'Circle the knob with the mouse pointer'], 'Turn until Spirit cannot tilt any further'],\r\n    ['In winter the panels supply only about 160 units a day', ['Pinch a switch, or point at it and hold, to turn it off', 'Click a switch to turn it off'], 'Turn off everything that is not needed to survive. If something must stay on, you are told why']],\r\n  opp_storm: [\r\n    ['The storm grew from 30 May to 10 June 2018', ['Pinch the timeline slider and move it to the right', 'Drag the timeline slider to the right'], 'Press the camera button on different days to photograph the Sun. Take 3 photos', 'The darker the sky, the higher the tau (how much dust blocks sunlight)']],\r\n  opp_energy: [\r\n    ['Each system uses energy every day. Turn them on or off', 'Press Run storm to see whether Opportunity lasts 12 days', 'The mission clock uses very little power, but it is the only thing that can wake the rover up']],\r\n  opp_comm: [\r\n    ['After the storm, JPL sent more than 1,000 commands to wake Opportunity', 'Drag the timeline until the sky clears', 'Press Transmit to send a wake-up command, and listen for an answer']],\r\n};\r\nconst howFor = (b, i) => { const k = Object.keys(RECIPES).find(n => RECIPES[n] === b.R), a = k && HOW[k] && HOW[k][i]; return (a || []).map(x => Array.isArray(x) ? x[G.mouseOnly ? 1 : 0] : x); };\r\nconst HINTS = {\r\n  unbolt: ['Pinch a bolt and twist your hand anticlockwise ↺ (let go and re-grip like a wrench), or circle the bolt with a fingertip', 'Circle each bolt anticlockwise ↺ with the mouse pointer'],\r\n  bolt: ['Pinch a screw and twist clockwise ↻, or circle it clockwise with a fingertip', 'Circle each screw clockwise ↻ with the mouse pointer'],\r\n  remove: ['Pinch the part, pull it away and drop it in the scrap bin', 'Drag the part into the scrap bin'],\r\n  fit: ['Pinch the matching spare and bring it onto the green outline', 'Drag the matching spare onto the green outline'],\r\n  wipe: ['Open your hand and rub back and forth over it', 'Hold the mouse button and scrub back and forth'],\r\n  tune: ['Pinch the knob and twist, or circle it with a fingertip', 'Circle the knob with the mouse pointer'],\r\n  tension: ['Raise both hands: strings stretch between your fingertips. Lay the index-finger string across the hook, pull your hands apart and hold it taut', 'Press on the hook, drag far away to pull the line taut, and hold'],\r\n  switches: ['Pinch a switch, or point at it and hold, to flip it', 'Click a switch to flip it'],\r\n  handle: ['Pinch the T-handle and move your hand left and right', 'Drag the T-handle left and right'],\r\n  route: ['Point at a stop and hold, or pinch it, to add it to the route. Do it again to remove it', 'Click stops to add or remove them, then click Drive'],\r\n  samples: ['Point at a rock to read its description, then pinch it and drop it in a bin', 'Hover a rock to read about it, then drag it to a bin'],\r\n  dusttest: ['Pinch the wheel and twist, or circle it with your fingertip, to drive', 'Circle the wheel with the
